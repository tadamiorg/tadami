name: Release

# Computes the next version from the commits since the last vX.Y.Z tag, builds the signed APK with it and
# publishes it as the GitHub release v<version>, which the in-app updater picks up (it reads
# /releases/latest and downloads the release APK). See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump. auto reads the commits since the last tag: a breaking change bumps the major version, a feat the minor one, anything else the patch one'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write

# Two runs at once would compute the same version
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not ${GITHUB_REF#refs/heads/}. Pick main in \"Use workflow from\"."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history and the tags, to find the last release and the commits since
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 .github/scripts/next_version.py --bump "$BUMP" --repo "$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          for secret in KEYSTORE_BASE64 KEY_STORE_PASSWORD ALIAS; do
            if [ -z "${!secret}" ]; then
              echo "::error::The $secret repository secret is not set. See docs/RELEASING.md."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"

      # AGP 9 only creates unit tests for the debug build type, the one CI tests too
      - name: Test and build release
        env:
          TADAMI_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PappVersionName="$VERSION"

      # The updater compares the release tag with the installed versionName: a mismatch would offer the
      # update forever
      - name: Check the APK version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          BADGING=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" dump badging app/build/outputs/apk/release/tadami.apk | head -n 1)
          echo "$BADGING"
          if [[ "$BADGING" != *"versionName='$VERSION'"* ]]; then
            echo "::error::The APK's versionName isn't $VERSION"
            exit 1
          fi

      # Android refuses an update signed with another certificate, so check it before publishing
      - name: Verify APK signature
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          # The default shell has no pipefail: a failed verify would pass through tee
          set -o pipefail
          APK=app/build/outputs/apk/release/tadami.apk
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          if [ -n "$RELEASE_CERT_SHA256" ]; then
            ACTUAL=$(grep -m 1 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" | awk '{ print $NF }' | tr '[:upper:]' '[:lower:]')
            EXPECTED=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK certificate SHA-256 is '$ACTUAL', expected '$EXPECTED' (RELEASE_CERT_SHA256). Installed apps could not update to it."
              exit 1
            fi
            echo "Signing certificate matches RELEASE_CERT_SHA256"
          else
            echo "::warning::RELEASE_CERT_SHA256 is not set, the signing certificate was not compared."
          fi

      # The release notes come from the commits (next_version.py), followed by the APK checksum
      - name: Prepare release asset
        id: asset
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ASSET="tadami-$TAG.apk"
          cp app/build/outputs/apk/release/tadami.apk "$ASSET"
          SHA256=$(sha256sum "$ASSET" | awk '{ print $1 }')
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "### Checksums"
            echo "| File | SHA-256 |"
            echo "| ---- | ------- |"
            echo "| $ASSET | \`$SHA256\` |"
          } > "$RUNNER_TEMP/release-body.md"
          echo "file=$ASSET" >> "$GITHUB_OUTPUT"

      # The mapping stays a workflow artifact: the release must only carry the APK, which is what
      # already installed versions of the updater download.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.tag }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn

      # Pushed now rather than when a draft is published, so the next run starts from this version
      - name: Tag the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG"

      # A draft unless the RELEASE_DRAFT variable is 'false': it reaches users through the in-app updater
      # only once published by hand (drafts and prereleases are invisible to it).
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tadami ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          files: ${{ steps.asset.outputs.file }}
          fail_on_unmatched_files: true
          draft: ${{ vars.RELEASE_DRAFT != 'false' }}
          make_latest: true

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
